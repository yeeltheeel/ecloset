services:

  postgres:
    image: postgres:16-alpine
    container_name: ecloset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecloset}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ecloset}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecloset-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ecloset-ai
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ai-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s   # SAM 2 + Fashion-CLIP грузятся долго на CPU
    networks:
      - ecloset-net

  backend:
    build:
      context: .                    # ← корень проекта
      dockerfile: backend/Dockerfile
    container_name: ecloset-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ecloset}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-mySuperSecretKeyForLocalDevOnly4752!}
      AI_BASE_URL: http://ai-service:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ecloset-net

volumes:
  postgres-data:
  ai-cache:

networks:
  ecloset-net:
    driver: bridge